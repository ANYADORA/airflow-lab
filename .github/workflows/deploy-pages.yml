name: Deploy Unlisted AirFlow Lab to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify ACCESS_TOKEN secret
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          if [ -z "$ACCESS_TOKEN" ]; then
            echo "::error::Repository secret ACCESS_TOKEN is not configured."
            exit 1
          fi

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check and run unit tests
        working-directory: frontend
        run: |
          npx tsc --noEmit
          npm test

      - name: Build static browser-solver bundle
        working-directory: frontend
        env:
          VITE_SOLVER_MODE: browser
          VITE_BASE_PATH: ./
        run: npm run build

      - name: Assemble unlisted Pages artifact under secret path
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: node scripts/build_pages_bundle.mjs

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages_dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
